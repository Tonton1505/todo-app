server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Cấu hình nén Gzip tối ưu tốc độ tải trang
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Chuẩn Single Page Application (SPA): Tự động route mọi request về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Định tuyến lỗi 404 về index.html để React Router / SPA xử lý
    error_page 404 /index.html;

    # Cache tài nguyên tĩnh (images, css, js) để tăng hiệu suất
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Trang lỗi 50x hệ thống
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
